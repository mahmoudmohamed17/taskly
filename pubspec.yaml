name: taskly
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.3
  flutter: 3.47.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  flutter_native_splash: ^2.4.8
  flutter_screenutil: ^5.9.3
  easy_localization: ^3.0.8
  go_router: ^18.0.2
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  dots_indicator: ^5.0.0
  smooth_page_indicator: ^3.0.0
  shared_preferences: ^2.5.6
  dotted_border: ^3.1.0
  animations: ^3.0.0
  font_awesome_flutter: ^11.0.0
  speech_to_text: ^7.5.0
  waveform_flutter: ^1.2.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path: ^1.9.1
  flutter_dotenv: ^6.0.1
  toastification: ^3.2.2
  intl: ^0.20.3
  equatable: ^3.0.0
  skeletonizer: ^3.0.0
  file_picker: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  json_serializable: ^6.14.1
  build_runner: ^2.16.1
  injectable_generator: ^3.0.0
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/translations/
    - assets/env/.env.dev
    - assets/env/.env.prod

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-Thin.ttf
          weight: 100
        - asset: assets/fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
